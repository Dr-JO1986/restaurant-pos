<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        @media (display-mode: fullscreen) {
            .kiosk-header { padding-top: .75rem; padding-bottom: .75rem; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-[1800px] flex-col px-3 py-3 sm:px-5 lg:px-7">
        <header class="kiosk-header mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.24em] text-amber-300">Kitchen Display System</p>
                <h1 class="text-2xl font-bold sm:text-3xl">{{ restaurant.name }}</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="connectionStatus" role="status" class="rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-3 py-2 text-sm font-semibold text-emerald-300">
                    ● เชื่อมต่อ · อัปเดตทุก 3 วินาที
                </span>
                <button id="soundToggle" type="button" aria-pressed="false" class="rounded-xl border border-amber-500/50 bg-amber-500/10 px-3 py-2 text-sm font-semibold text-amber-200 hover:bg-amber-500/20">
                    🔇 เปิดเสียงแจ้งเตือน
                </button>
                <button id="fullscreenToggle" type="button" class="rounded-xl border border-slate-600 bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700">
                    ⛶ เต็มหน้าจอ
                </button>
                <a href="{% url 'merchant_logout' %}" class="rounded-xl border border-slate-600 bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700">
                    ออกจากระบบครัว
                </a>
            </div>
        </header>

        {% if messages %}
            <div class="mb-3 space-y-2">
                {% for message in messages %}
                    <div class="rounded-xl border border-sky-500/40 bg-sky-500/10 px-4 py-3 text-sm text-sky-100">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div id="kitchen-live"
             class="flex-1"
             hx-get="{% url 'kitchen_live_updates' restaurant.slug %}"
             hx-trigger="load, every 3s"
             hx-swap="innerHTML"
             hx-sync="this:replace"
             aria-live="polite">
            {% include 'restaurants/kitchen_live_updates.html' %}
        </div>
    </main>

    <script>
        let audioEnabled = false;
        let audioContext;
        const knownOrders = new Set(
            Array.from(document.querySelectorAll('[data-order-id]'), element => element.dataset.orderId)
        );
        function playAlert(kind) {
            if (!audioEnabled) return;
            audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
            const notes = [660, 880];
            notes.forEach((frequency, index) => {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const startAt = audioContext.currentTime + index * 0.18;
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                gain.gain.setValueAtTime(0.0001, startAt);
                gain.gain.exponentialRampToValueAtTime(0.22, startAt + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.14);
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start(startAt);
                oscillator.stop(startAt + 0.15);
            });
        }

        document.getElementById('soundToggle').addEventListener('click', async event => {
            audioEnabled = !audioEnabled;
            if (audioEnabled) {
                audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
            }
            event.currentTarget.setAttribute('aria-pressed', String(audioEnabled));
            event.currentTarget.textContent = audioEnabled ? '🔔 ปิดเสียงแจ้งเตือน' : '🔇 เปิดเสียงแจ้งเตือน';
            event.currentTarget.classList.toggle('border-emerald-500/50', audioEnabled);
        });

        document.getElementById('fullscreenToggle').addEventListener('click', async () => {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        });

        document.body.addEventListener('htmx:afterSwap', event => {
            if (event.detail.target.id !== 'kitchen-live') return;
            let hasNewOrder = false;
            document.querySelectorAll('#kitchen-live [data-order-id]').forEach(element => {
                if (!knownOrders.has(element.dataset.orderId)) {
                    knownOrders.add(element.dataset.orderId);
                    hasNewOrder = true;
                }
            });
            if (hasNewOrder) playAlert('order');
        });

        document.body.addEventListener('htmx:beforeRequest', () => {
            document.getElementById('connectionStatus').textContent = '◌ กำลังอัปเดต…';
        });
        document.body.addEventListener('htmx:afterRequest', event => {
            if (event.detail.successful) {
                document.getElementById('connectionStatus').textContent = '● เชื่อมต่อ · อัปเดตทุก 3 วินาที';
            }
        });
        document.body.addEventListener('htmx:responseError', () => {
            document.getElementById('connectionStatus').textContent = '! เชื่อมต่อขัดข้อง · กำลังลองใหม่';
        });
    </script>
</body>
</html>

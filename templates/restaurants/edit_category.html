<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แก้ไขหมวดหมู่ - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen py-12">
    <div class="bg-white p-8 rounded-2xl shadow-md max-w-md w-full border border-gray-100">
        <h1 class="text-xl font-bold text-indigo-600 mb-6 border-b pb-3">✏️ แก้ไขชื่อหมวดหมู่</h1>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อหมวดหมู่</label>
                <input type="text" name="category_name" value="{{ category.name }}" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">
                    บันทึกการแก้ไข
                </button>
                <a href="/store/{{ restaurant.slug }}/" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 rounded-lg text-center transition duration-200">
                    ยกเลิก
                </a>
            </div>
        </form>
    </div>
</body>
</html>

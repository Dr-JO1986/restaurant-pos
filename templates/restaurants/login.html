<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบจัดการร้านอาหาร - Spooky SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-600">🏪 Restaurant Portal</h1>
            <p class="text-sm text-gray-500 mt-1">เข้าสู่ระบบจัดการร้านอาหารของคุณ</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <input id="password" type="password" name="password" autocomplete="current-password" required class="w-full px-4 py-2 pr-16 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" id="toggle-password" aria-label="แสดงรหัสผ่าน" aria-pressed="false" class="absolute inset-y-0 right-0 px-4 text-sm text-indigo-600 hover:text-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-r-lg">
                        แสดง
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('toggle-password');

        togglePasswordButton.addEventListener('click', function () {
            const isPasswordVisible = passwordInput.type === 'text';
            passwordInput.type = isPasswordVisible ? 'password' : 'text';
            togglePasswordButton.textContent = isPasswordVisible ? 'แสดง' : 'ซ่อน';
            togglePasswordButton.setAttribute('aria-label', isPasswordVisible ? 'แสดงรหัสผ่าน' : 'ซ่อนรหัสผ่าน');
            togglePasswordButton.setAttribute('aria-pressed', String(!isPasswordVisible));
        });
    </script>
</body>
</html>

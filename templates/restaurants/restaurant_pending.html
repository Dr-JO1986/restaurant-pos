<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัญชีอยู่ระหว่างตรวจสอบ - Restaurant POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10 text-slate-800">
    <main class="w-full max-w-lg rounded-2xl border border-amber-100 bg-white p-8 text-center shadow-lg">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-amber-100 text-3xl">⏳</div>
        <h1 class="text-2xl font-bold text-slate-900">บัญชีอยู่ระหว่างรอตรวจสอบ</h1>
        <p class="mt-3 text-sm leading-7 text-slate-600">
            ร้าน <strong>{{ restaurant.name }}</strong> อยู่ระหว่างรออนุมัติการใช้งาน
            ขณะนี้ยังไม่สามารถเข้าใช้งานระบบ POS ได้
        </p>
        <p class="mt-2 text-sm text-slate-600">กรุณาติดต่อแอดมินผ่าน LINE OA เพื่อตรวจสอบสถานะการสมัครหรือการชำระเงิน</p>
        <form method="post" action="{% url 'merchant_logout' %}" class="mt-6">
            {% csrf_token %}
            <button type="submit" class="rounded-lg bg-slate-800 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-900">
                ออกจากระบบ
            </button>
        </form>
    </main>
</body>
</html>
